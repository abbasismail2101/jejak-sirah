<style>
:root{
  color-scheme: dark;
  --night:#141A3A; --night2:#1F2753; --dusk:#2E3775; --hill:#3A3F7A;
  --sand:#F2C98A; --dune:#D9955A; --dune2:#B8703F;
  --gold:#FFD45E; --gold-deep:#E0A92A; --mint:#4FD1A1; --mint-deep:#2E9C75;
  --coral:#FF7B6B; --sky-blue:#8CC4F0;
  --paper:#FFF7E8; --paper2:#F6E9CF; --ink:#2B2340; --ink-muted:#76698A;
  --text:#F6F1FF; --muted:#B9B6DA; --line:rgba(255,255,255,.16);
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-jawi:'Noto Naskh Arabic','Scheherazade New','Amiri','Geeza Pro','Arial',serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sky-blue);outline-offset:3px}
.jawi{font-family:var(--f-jawi);direction:rtl}

/* sky */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 120% 70% at 50% -10%,var(--dusk) 0%,var(--night) 62%)}
#sky .st{position:absolute;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite alternate}
#sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:22vh;min-height:120px}
@keyframes tw{from{opacity:.15}to{opacity:.9}}

#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}

/* buttons */
.btn{font-family:var(--f-display);font-weight:700;font-size:1.15rem;border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;background:var(--gold);color:#3A2600;box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
a.btn{text-decoration:none}
.btn.mint{background:var(--mint);color:#053A28;box-shadow:0 5px 0 var(--mint-deep)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{font-size:.98rem;min-height:42px;padding:.4em 1em}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* login */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:6vh}
.moon{width:66px;height:66px;border-radius:50%;box-shadow:18px -8px 0 0 var(--gold);transform:rotate(-20deg);margin:0 auto 6px 30px}
.brand h1{font-size:clamp(2.8rem,9vw,4.4rem);font-weight:800;color:var(--sand);letter-spacing:.5px}
.brand .bj{font-size:1.7rem;color:var(--gold);margin-top:2px}
.brand .tag{color:var(--muted);font-weight:700;margin-top:6px}
.ask{font-size:1.2rem;font-weight:700}
.profile{background:var(--paper);color:var(--ink);border:0;border-radius:28px;padding:26px 44px 20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--paper2),0 20px 40px rgba(0,0,0,.4);transition:transform .15s}
.profile:hover{transform:translateY(-4px) rotate(-1deg)}
.avatar{position:relative;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--dune));display:grid;place-items:center;font-family:var(--f-display);font-size:3.4rem;font-weight:800;color:#5A2E0C}
.avatar::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid transparent}
.profile.loading .avatar::after{border-top-color:var(--mint);border-right-color:var(--gold);animation:spin .8s linear infinite}
.pname{font-family:var(--f-display);font-size:1.9rem;font-weight:800;margin-top:6px}
.pclass{color:var(--ink-muted);font-weight:700}
.hint{color:var(--muted);font-size:.95rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* welcome */
.welcome{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:7vh}
.welcome .salam{font-family:var(--f-jawi);font-size:2rem;color:var(--gold)}
.welcome h2{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;color:var(--sand)}
.welcome h2 .l{display:inline-block;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
.quote{background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:24px;padding:22px 26px;max-width:560px;font-size:1.2rem;font-weight:700;line-height:1.55;position:relative;animation:rise .6s .7s both}
.quote .qm{font-family:var(--f-display);font-size:3.2rem;color:var(--gold);line-height:.5;display:block;margin-bottom:8px}
.quote small{display:block;margin-top:8px;color:var(--muted);font-weight:600}
@keyframes pop{0%{transform:scale(.2) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

/* topbar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.me{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.me .avatar{width:46px;height:46px;font-size:1.5rem;flex:none}
.topbar .me{min-width:0;max-width:100%}
.me .nm{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .pills{display:flex;gap:6px;flex:none}
.me .pill{font-size:1.05rem}
.rkp{border:0;color:var(--text);font-family:inherit;cursor:pointer}
.rkp:active{transform:translateY(1px)}
.me .avatar::after{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* map */
.banner{text-align:center;font-size:1.15rem;font-weight:700;color:var(--sand);margin:4px auto 6px;max-width:560px}
.map{display:block;width:100%;max-width:520px;margin:0 auto}
.map text{font-family:var(--f-display)}
.node{cursor:pointer}
.node.locked{cursor:default}
.node .ring{transform-box:fill-box;transform-origin:center}
.node.open .ring{animation:pulse 1.6s ease-in-out infinite}
.camel{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.28);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.stn{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.stn.locked{opacity:.55;cursor:default}
.stn .t{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.stn .p{color:var(--muted);font-weight:700;font-size:.95rem}
.stn .s{font-weight:800;font-size:.95rem}
.s.open{color:var(--gold)} .s.wait{color:var(--sky-blue)} .s.done{color:var(--mint)}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qhead .ttl small.bab{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:700}
.qhead .ttl{font-family:var(--f-display);font-size:1.35rem;font-weight:800;color:var(--sand)}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.12);margin:34px 6px 14px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--dune),var(--gold));transition:width .4s}
.track .cm{position:absolute;top:-32px;font-size:30px;line-height:1;transform:translateX(-50%) scaleX(-1);transition:left .4s}
.track .flag{position:absolute;right:-6px;top:-30px;font-size:26px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 2px 12px}
.sec .sj{font-size:1.5rem;color:var(--gold)}
.sec .sr{color:var(--muted);font-weight:700}
.card{background:var(--paper);color:var(--ink);border-radius:26px;padding:22px 22px 24px;box-shadow:0 8px 0 var(--paper2),0 22px 44px rgba(0,0,0,.35);animation:rise .35s both}
.qnum{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;border-radius:12px;padding:2px 12px;margin-bottom:6px}
.qtext{font-size:clamp(1.45rem,3.8vw,1.95rem);line-height:2.1;text-align:right}
.qsub{color:var(--ink-muted);font-weight:700;margin-top:4px}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;direction:rtl;text-align:right;background:#fff;border:3px solid #EADFCB;border-radius:18px;padding:10px 16px;font-family:var(--f-jawi);font-size:clamp(1.25rem,3.2vw,1.55rem);color:var(--ink);cursor:pointer;min-height:66px;transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt .lt{flex:none;width:44px;height:44px;border-radius:50%;background:#F3E6CC;display:grid;place-items:center;font-size:1.35rem;font-weight:700}
.opt.sel{border-color:var(--gold-deep);background:#FFF1C7;animation:bounce .35s}
.opt.sel .lt{background:var(--gold)}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.blank{display:inline-block;min-width:4.6em;border-bottom:3px dashed var(--dune2);padding:0 .35em;text-align:center;line-height:1.5}
.blank.filled{border-bottom-style:solid;background:#FFF1C7;border-radius:10px 10px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl;margin-top:18px}
.chip{font-family:var(--f-jawi);font-size:1.45rem;padding:6px 20px;border-radius:16px;border:3px solid #EADFCB;background:#fff;color:var(--ink);cursor:pointer;min-height:56px}
.chip.used{opacity:.4}
.chip.sel{border-color:var(--gold-deep);background:#FFF1C7;opacity:1;animation:bounce .35s}
.left-item{font-size:clamp(1.6rem,4vw,2.1rem);text-align:center;background:#fff;border-radius:18px;padding:10px;border:3px dashed #EADFCB;margin-top:8px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.tfb{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid #EADFCB;border-radius:20px;padding:14px 8px;cursor:pointer;color:var(--ink)}
.tfb .ic{font-size:2.2rem;font-weight:800;font-family:var(--f-display);line-height:1}
.tfb .jw{font-family:var(--f-jawi);font-size:1.5rem}
.tfb .rm{color:var(--ink-muted);font-weight:700;font-size:.9rem}
.tfb.yes .ic{color:var(--mint-deep)} .tfb.no .ic{color:#D2483A}
.tfb.sel.yes{border-color:var(--mint-deep);background:#DDF7EC;animation:bounce .35s}
.tfb.sel.no{border-color:#D2483A;background:#FFE3DE;animation:bounce .35s}
textarea{width:100%;min-height:120px;margin-top:14px;font:600 1.25rem/1.5 var(--f-body);border-radius:16px;border:3px solid #EADFCB;padding:12px 14px;color:var(--ink);background:#fff;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.qgrid{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.qgrid .grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.qgrid .gl{font-family:var(--f-jawi);color:var(--muted);width:40px;text-align:center;font-size:1.2rem}
.g{width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.1);color:var(--muted);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.g.done{background:var(--dune);color:#fff}
.g.cur{box-shadow:0 0 0 3px var(--gold)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--gold);color:#3A2600;font-family:var(--f-display);font-weight:800;font-size:1.2rem;padding:12px 22px;border-radius:18px;box-shadow:0 6px 0 var(--gold-deep);z-index:30;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0)}

/* center panels */
.panel{max-width:620px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.panel h2{font-size:clamp(2rem,6vw,3rem);color:var(--sand)}
.panel p{font-size:1.15rem;font-weight:700;margin:0;max-width:52ch}
.big-emoji{font-size:5rem;line-height:1;animation:pop .6s both}
.unans{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* pin */
.pin{background:var(--paper);color:var(--ink);border-radius:28px;padding:26px 22px;max-width:360px;width:100%;box-shadow:0 8px 0 var(--paper2)}
.pin h3{font-size:1.6rem}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink-muted)}
.dot.f{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:62px;border-radius:18px;border:0;background:#fff;color:var(--ink);font-family:var(--f-display);font-size:1.7rem;font-weight:800;box-shadow:0 4px 0 #E4D6BA;cursor:pointer}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #E4D6BA}
.pin .err{color:#C23B2E;font-weight:800;min-height:1.5em;margin:10px 0 0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* parent check */
.phead h2{font-size:1.8rem;color:var(--sand)}
.phead p{color:var(--muted);font-weight:700;margin:4px 0 0}
.psec{font-family:var(--f-jawi);font-size:1.35rem;color:var(--gold);margin:22px 0 8px}
.rows{display:grid;gap:10px}
.rw{background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:36px 1fr;gap:6px 12px}
.rw .n{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--ink-muted)}
.rw .q{font-family:var(--f-jawi);direction:rtl;text-align:right;font-size:1.15rem;line-height:1.9}
.rw .ans{grid-column:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px;align-items:start}
.lbl{display:block;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.av{font-weight:700;font-size:1.05rem}
.av.j{font-family:var(--f-jawi);font-size:1.25rem;direction:rtl;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:.95rem}
.tag.ok{background:#D6F5E8;color:#0B6B47}
.tag.bad{background:#FFE0DB;color:#A8332A}
.mk{display:flex;gap:8px;flex-wrap:wrap}
.mkb{border:2px solid #D9CDB6;background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--ink);min-height:40px}
.mkb.on.ok{background:#D6F5E8;border-color:#0B6B47;color:#0B6B47}
.mkb.on.bad{background:#FFE0DB;border-color:#A8332A;color:#A8332A}
.checkbar{position:sticky;bottom:0;margin-top:20px;background:var(--night2);border:2px solid var(--line);border-radius:22px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.checkbar .sc{font-family:var(--f-display);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.checkbar .sc small{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--muted)}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:3vh}
.result .rt{color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.score{font-family:var(--f-display);font-size:clamp(4.5rem,16vw,7rem);font-weight:800;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted)}
.stars{display:flex;gap:10px;justify-content:center}
.bs{font-size:3.4rem;line-height:1;color:rgba(255,255,255,.18)}
.bs.on{color:var(--gold);text-shadow:0 0 18px rgba(255,212,94,.6);animation:starpop .55s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(1s + var(--i) * 300ms)}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.msg{font-size:1.25rem;font-weight:800;max-width:48ch}
.earned{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin:10px 0}
.stk-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;animation:flipin .8s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(2s + var(--i,0) * 400ms)}
@keyframes flipin{0%{transform:perspective(600px) rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.stk{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;font-size:64px;line-height:1;box-shadow:0 0 0 8px #fff,0 14px 26px rgba(0,0,0,.45);transform:rotate(-7deg)}
.stk.gold{background:radial-gradient(circle at 35% 30%,#FFF1B0,#F2B632)}
.stk.silver{background:radial-gradient(circle at 35% 30%,#FFFFFF,#AEB8CB)}
.stk.bronze{background:radial-gradient(circle at 35% 30%,#FFD8B0,#C98548)}
.stk.spirit{background:radial-gradient(circle at 35% 30%,#DDF1FF,#6FA9DD)}
.stk.special{background:radial-gradient(circle at 35% 30%,#D9FFF0,#35B889)}
.stk.trophy{background:radial-gradient(circle at 35% 30%,#FFF3C4,#E29B1B)}
.stk.lock{background:transparent;box-shadow:none;border:4px dashed var(--line);color:var(--muted);font-family:var(--f-display);font-size:48px;transform:none}
.stk-name{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.stk-tier{color:var(--muted);font-weight:700;font-size:.9rem;margin-top:-8px}
.learn{width:100%;text-align:left;margin-top:14px}
.learn summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--sand);list-style:none;text-align:center}
.learn summary::-webkit-details-marker{display:none}
.learn .rows{margin-top:12px}

function confetti(n){
  if(reduced)return;const c=document.getElementById("fx"),x=c.getContext("2d");
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=["#FFD45E","#4FD1A1","#FF7B6B","#F2C98A","#8CC4F0","#ffffff"];
  const P=[];for(let i=0;i<(n||140);i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*28,vy:-Math.random()*26-8,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,s:(Math.random()*8+6)*devicePixelRatio,c:cols[i%cols.length]});
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.9;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}

function subjSummary(k,d){
  const n=nSets(k);let done=0,stars=0,perfect=false,cur=n+1;
  for(let s=1;s<=n;s++){const b=d&&d.best&&d.best[s];if(b){done++;stars+=b.stars;if(b.score===30)perfect=true}else if(cur===n+1)cur=s}
  const rev=Math.min(Object.keys((d&&d.reviewed)||{}).length,n);
  const stk=done+(perfect?1:0)+(d&&d.reviewBadge?1:0)+(done===n?1:0);
  return {done,stars:Math.min(stars,3*n),stk,rev,cur};
}

  t.done=Math.min(t.done,100);t.stars=Math.min(t.stars,300);t.stk=Math.min(t.stk,200);t.rev=Math.min(t.rev,100);

async function saveKidReset(){
  const r=UI.kr,u=ST.users.find(x=>x.id===r.id);if(!u||r.saving)return;
  const bad=m=>{r.err=m;SND.play("bonk");render()};

  if(u.cloud){
    if(!cloudOk())return bad("Perlukan internet untuk tukar kod.");

  }

  const dOf=x=>SS?subDone(x,sk):x.done,sOf=x=>SS?((x.sub&&x.sub[sk]&&x.sub[sk].s)||0):x.stars;

    }
    return head+filt+`<p class="bnote">${BS.e} ${esc(BS.n)}: setiap murid berada di set yang sedang dijawab. Kemajuan dikira selepas Ibu/Ayah semak.</p><div class="broad">${rows}</div>`;
  }
  if(B.tab==="ind"){
    const sorted=SS?[...list].sort((a,b)=>dOf(b)-dOf(a)||sOf(b)-sOf(a)||a.name.localeCompare(b.name)):[...list].sort(boardSort);

  app.classList.toggle("ltr",!!(USER&&SUB&&!SUB.rtl));
  app.innerHTML=v()+(["quiz","check","review","pin"].includes(UI.screen)?"":`<footer class="credit">Dibangunkan oleh Abah Hassan</footer>`)+(UI.installHelp?installModal():"")+(UI.notice?noticeModal():(UI.guide?guideModal():""))+(UI.avFor?avModal():"")+(UI.share?shareModal():"");
  if(UI.screen==="parent"||UI.screen==="check")ppMark();SND.setTheme(themeFor(UI.screen));paintSnd();saveSess();
  if(UI.screen==="welcome")SND.play("jingle",0,.35);
  if(UI.screen==="welcome")setTimeout(()=>confetti(90),500);
  if(UI.screen==="result")runResultFx();
  if(UI.screen==="map"&&UI.scrollMap){UI.scrollMap=false;const h=document.getElementById("here");if(h&&curSet()>2)h.scrollIntoView({block:"center",behavior:reduced?"auto":"smooth"});else window.scrollTo({top:0})}
  if(UI.screen==="login"&&UI.adding){const n=document.getElementById("newName");if(n&&!UI.newName)n.focus()}
}
function runResultFx(){
  const r=D.results[UI.set],el=document.getElementById("cnt"),big=SETS[UI.set-1].big;
  if(reduced||!UI.fresh){el.textContent=r.score;return}
  let n=0;const step=()=>{el.textContent=n;if(n%2===0&&n>0)SND.play("count");if(n<r.score){n++;setTimeout(step,900/Math.max(r.score,1))}};step();
  for(let i=0;i<r.stars;i++)setTimeout(()=>SND.play("star",i),1150+i*300);
  setTimeout(()=>SND.play(r.stars>=1||big?"fanfare":"jingle"),1900);
  setTimeout(()=>SND.play("sparkle"),2250);
  setTimeout(()=>confetti(big?260:(r.stars>=2?180:100)),1900);
  if(big)setTimeout(()=>confetti(200),2700);
  if(allDone()){setTimeout(()=>confetti(240),3300);setTimeout(()=>SND.play("fanfare"),3300)}
}

function setAnswer(val){
  const set=SETS[UI.set-1],it=set.items[UI.q],was=isAnswered(D.answers[set.id][it.id]);
  D.answers[set.id][it.id]=val;save();
  const n=answeredCount(set.id),k=USER.id+":"+set.id+":"+n;
  if(!was&&STEP_MSG[n]&&!UI.toastSeen[k]){UI.toastSeen[k]=1;toast(NM(STEP_MSG[n]));SND.play("ding",0,.18);if(n===15||n===30)confetti(70)}
  render();
  if(!was&&it.sec!=="E"&&UI.q<29){const q=UI.q;setTimeout(()=>{if(UI.screen==="quiz"&&UI.q===q){UI.q++;render()}},550)}
}
function openStation(s){
  const st=status(s);if(st==="locked")return;UI.set=s;
  if(st==="done"){UI.fresh=false;go("result");return}
  if(st==="wait"){go("submitted");return}
  const first=SETS[s-1].items.findIndex(x=>!isAnswered(D.answers[s][x.id]));
  go("quiz",{q:first<0?29:first});
  if(st==="redo")toast(NM("🔁 Cuba lagi, {n}! Markah terbaik kamu tetap disimpan."));
  if(st==="open")toast(NM(SETS[s-1].big?"🚩 Checkpoint Besar! Bismillah, {n}!":"Bismillah! Selamat menjawab, {n} 🌙"));
}

async function saveUser(){
  if(UI.saving)return;
  const name=UI.newName.trim().replace(/\s+/g," ");
  const err=m=>{UI.addErr=m;SND.play("bonk");render()};
  if(!name)return err("Tulis nama panggilan dulu.");
  if(!CLS.includes(UI.newCls))return err("Pilih kelas: 2 Aisyah atau 2 Hafsah.");
  if(!/^\d{4}$/.test(UI.newP1||""))return err("Kod anak mesti 4 nombor.");
  if(UI.newP1!==UI.newP2)return err("Kod anak tak sama. Taip semula.");
  if(!ST.pin){if(!/^\d{4}$/.test(UI.newPP1||""))return err("Kod Ibu/Ayah mesti 4 nombor.");if(UI.newPP1!==UI.newPP2)return err("Kod Ibu/Ayah tak sama. Taip semula.");if(UI.newPP1===UI.newP1)return err("Guna kod Ibu/Ayah yang berbeza daripada kod anak.")}
  if(isCloudBuild()&&!UI.consent)return err("Sila tandakan persetujuan ibu/bapa.");
  if(isCloudBuild()&&!cloudOk()){UI.saving=true;UI.addErr="Menyambung ke internet…";render();const okc=await waitCloud(10000);UI.saving=false;if(!okc)return err("Tak dapat sambung ke internet. Semak sambungan dan cuba lagi.")}
  const cOk=cloudOk();
  if(cOk&&!UI.consent)return err("Sila tandakan persetujuan ibu/bapa.");
  if(ST.users.some(u=>u.id!==UI.upgradeId&&u.name.toLowerCase()===name.toLowerCase()&&u.cls===UI.newCls))return err("Nama ini sudah ada dalam phone ini.");
  const old=UI.upgradeId,oldU=old?ST.users.find(x=>x.id===old):null;
  const id=(oldU&&oldU.cloud)?old:newId();
  const u={id,name,cls:UI.newCls,c:UI.newC,pinH:hp(id+":"+UI.newP1),pin:UI.newP1,cloud:cOk,lock:!!UI.newLock};
  const prog=normProg(ST.prog[old||id]);
  if(cOk){
    UI.saving=true;UI.addErr="";render();
    try{
      const list=await withTimeout(CLOUD.listAll(),8000);
      if(list.some(x=>x.id!==id&&!x.hidden&&x.cls===u.cls&&x.name.toLowerCase()===name.toLowerCase())){UI.saving=false;return err("Nama ini sudah ada dalam "+u.cls+". Tambah huruf atau nama lain, contoh: "+name+" A.")}
      await withTimeout(CLOUD.putStudent(id,studentDoc(u,prog)),8000);
      await withTimeout(CLOUD.putState(id,JSON.stringify(prog)),8000);
    }catch(e){UI.saving=false;return err("Tak dapat simpan ke internet. Semak sambungan dan cuba lagi.")}
    UI.saving=false;
  }
  const oi=old?ST.users.findIndex(x=>x.id===old):-1;
  if(oi>=0)ST.users[oi]=u;else{const i=ST.users.findIndex(x=>x.id===id);if(i>=0)ST.users[i]=u;else ST.users.push(u)}
  if(old&&old!==id)delete ST.prog[old];
  if(!ST.pin&&UI.newPP1)ST.pin=hp(UI.newPP1);
  ST.prog[id]=prog;save();SND.play("sparkle");
  Object.assign(UI,{adding:false,upgradeId:null,newName:"",newCls:"",newP1:"",newP2:"",consent:false,addErr:""});render();toast("Selamat datang, "+name+"! Tekan gambar untuk masuk.");
}

      if(s==="all"){P.subj[SUBJ]=freshSubj(SUBJ);D=P.subj[SUBJ]}else resetSet(s);
      UI.confirmReset=null;save();render();toast(s==="all"?"Semua jawapan "+SUB.n+" "+USER.name+" dipadam":SETS[s-1].name+" dibuka semula");break}
    case "delUser":{
      const id=b.dataset.u;
      if(UI.confirmDel!==id){UI.confirmDel=id;render();break}
      const nm=(ST.users.find(u=>u.id===id)||{}).name;
      ST.users=ST.users.filter(u=>u.id!==id);delete ST.prog[id];save();UI.confirmDel=null;toast(nm+" dipadam");
      if(USER&&USER.id===id){USER=null;D=null;P=null;go("login")}else render();break}
  }
});
document.addEventListener("click",e=>{if(UI.ddOpen&&!(e.target.closest&&e.target.closest(".dd"))){UI.ddOpen=null;render()}});
app.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.sel;if(k==="pSubj"){setSubject(e.target.value);UI.confirmReset=null;SND.play("tap");render();return}if(!k||!UI.board)return;if(k==="bSubj")UI.board.subj=e.target.value;if(k==="bCls")UI.board.cls=e.target.value;SND.play("tap");render()});
app.addEventListener("input",e=>{
  const k=e.target.dataset.input;
  if(k==="newName"){UI.newName=e.target.value;return}
  if(k==="tGate"&&UI.tch&&UI.tch.gate){UI.tch.gate.val=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="newP1"){UI.newP1=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="newP2"){UI.newP2=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="consent"){UI.consent=e.target.checked;return}
  if(k==="newLock"){UI.newLock=e.target.checked;return}
  if(k==="newPP1"){UI.newPP1=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="newPP2"){UI.newPP2=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="kr1"){UI.kr.p1=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="kr2"){UI.kr.p2=e.target.value.replace(/\D/g,"").slice(0,4);return}
  if(k==="math"){UI.mathVal=e.target.value;return}
  if(k==="e"){
    const set=SETS[UI.set-1],it=set.items[UI.q],was=isAnswered(D.answers[set.id][it.id]);
    D.answers[set.id][it.id]=e.target.value;save();
    const n=answeredCount(set.id),tk=USER.id+":"+set.id+":"+n;
    if(!was&&STEP_MSG[n]&&!UI.toastSeen[tk]){UI.toastSeen[tk]=1;toast(NM(STEP_MSG[n]))}
    document.querySelectorAll(".g.cur").forEach(g=>g.classList.toggle("done",isAnswered(e.target.value)));
    const c=document.querySelector(".count");if(c)c.textContent=n+"/30 dijawab";
    const f=document.querySelector(".track .fill"),cm=document.querySelector(".track .cm");if(f){f.style.width=(n/30*100)+"%";cm.style.left=Math.max(3,n/30*100)+"%"}
  }
});
app.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("g[data-act]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});

window.addEventListener("cloud-ready",()=>{if(UI.screen==="teacher"&&UI.tch&&!UI.tch.data){loadTch();return}if(UI.screen==="board"&&UI.board&&UI.board.err){loadBoard();render()}else if(["login","welcome","subjects","map","book","parent","result"].includes(UI.screen))render();if(USER&&USER.cloud)pullNewer()});
async function pullNewer(){
  if(!USER||!USER.cloud||!cloudOk())return;
  const id=USER.id;
  try{const st=await withTimeout(CLOUD.getState(id),5000);if(st&&USER&&USER.id===id){const c=JSON.parse(st);if(c.v===2&&(c.ts||0)>(P.ts||0)){P=ST.prog[id]=normProg(c);setSubject(SUBJ);try{localStorage.setItem(KEY2,JSON.stringify(ST))}catch(e){}if(!["quiz","check","review","pin"].includes(UI.screen))render()}}}catch(e){}
}
(function restore(){
  if(!noticeSeen())UI.notice=true;
  let ss=null;try{ss=JSON.parse(localStorage.getItem(SESS)||"null")}catch(e){}
  if(ss&&ss.t){openTeacher(ss);return}
  if(ss&&ss.g){const b=ss.b||{};UI.boardBack="login";UI.board={tab:b.tab||"ind",cls:b.cls||CLS[0],subj:b.subj||"all",data:null,err:""};UI.screen="board";render();loadBoard();return}
  if(!ss||!ST.users.some(u=>u.id===ss.u)){render();return}
  login(ss.u);if(ss.k)setSubject(ss.k);UI.set=ss.set||1;UI.q=ss.q||0;UI.fresh=false;
  let sc=ss.s;const st=UI.set>=1&&UI.set<=N?status(UI.set):"locked";
  if(sc==="quiz"&&!["open","progress","redo"].includes(st))sc="map";
  if(sc==="result"&&!D.results[UI.set])sc="map";
  if(sc==="submitted"&&st!=="wait")sc="map";
  if((sc==="parent"||sc==="check")&&ppOk()){if(sc==="check"&&st!=="wait")sc="parent";UI.parentBack=ss.pb||"subjects";UI.screen=sc;render();pullNewer();return}
  if(!["subjects","map","quiz","book","board","result","submitted","confirm"].includes(sc))sc="subjects";
  if(sc==="board"){UI.board={tab:(ss.b&&ss.b.tab)||"ind",cls:(ss.b&&ss.b.cls)||USER.cls||CLS[0],subj:(ss.b&&ss.b.subj)||"all",data:null,err:""};UI.screen="board";render();loadBoard()}
  else{UI.scrollMap=sc==="map";UI.screen=sc;render()}
  pullNewer();
})();
})();
</script>

<script type="module">
const V = "10.12.2", B = "https://www.gstatic.com/firebasejs/" + V + "/";
const cfg = window.FIREBASE_CONFIG;
if (cfg) {
  try {
    const { initializeApp } = await import(B + "firebase-app.js");
    const { getAuth, signInAnonymously, onAuthStateChanged } = await import(B + "firebase-auth.js");
    const { initializeFirestore, persistentLocalCache, doc, setDoc, getDoc, getDocs, collection, serverTimestamp } = await import(B + "firebase-firestore.js");
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    let db;
    try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch (e) { db = initializeFirestore(app, {}); }
    const ready = new Promise((res, rej) => { onAuthStateChanged(auth, u => { if (u) res(u); }); signInAnonymously(auth).catch(rej); });
    window.CLOUD = {
      ok: true, ready,
      async listAll() { await ready; const s = await getDocs(collection(db, "students")); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
      async putStudent(id, data) { await ready; await setDoc(doc(db, "students", id), { ...data, updated: serverTimestamp() }); },
      async putState(id, state) { await ready; await setDoc(doc(db, "progress", id), { state, updated: serverTimestamp() }); },
      async getState(id) { await ready; const s = await getDoc(doc(db, "progress", id)); return s.exists() ? s.data().state : null; }
    };
    window.dispatchEvent(new Event("cloud-ready"));
  } catch (e) { console.warn("Firebase tidak dapat dimuatkan", e); }
}
</script>
